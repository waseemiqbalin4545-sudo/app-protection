<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Devices - App Protection</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#111827;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:205px;
    background:#101827;
    color:white;
    padding:22px 12px;
}

.logo{
    font-size:20px;
    font-weight:bold;
    padding:0 10px 35px;
}

.logo span{
    color:#2870f0;
}

.menu a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:12px 14px;
    margin:7px 0;
    border-radius:8px;
    font-size:14px;
}

.menu a:hover,
.menu a.active{
    background:#2864e8;
}

.main{
    margin-left:205px;
    min-height:100vh;
}

.topbar{
    height:56px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#2864e8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.logout{
    background:#ef4444;
    color:white;
    border:0;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
}

.content{
    padding:28px;
}

h1{
    font-size:25px;
    margin-bottom:5px;
}

.subtitle{
    color:#64748b;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:12px;
    padding:22px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.stat-title{
    color:#64748b;
    font-size:14px;
}

.stat-number{
    color:#2563eb;
    font-size:27px;
    font-weight:bold;
    margin-top:8px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.tab{
    border:0;
    background:#e5e7eb;
    padding:10px 17px;
    border-radius:7px;
    cursor:pointer;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:left;
    background:#f8fafc;
    padding:13px;
    color:#475569;
    font-size:13px;
}

td{
    padding:13px;
    border-top:1px solid #e5e7eb;
    font-size:13px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.active-status{
    background:#dcfce7;
    color:#166534;
}

.blocked{
    background:#fee2e2;
    color:#991b1b;
}

.btn{
    border:0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    color:white;
    font-size:12px;
    margin:2px;
}

.btn-green{
    background:#16a34a;
}

.btn-red{
    background:#ef4444;
}

.btn-blue{
    background:#2563eb;
}

.btn-gray{
    background:#64748b;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:30px;
}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:900px){

    .sidebar{
        width:170px;
    }

    .main{
        margin-left:170px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
    }

    .menu{
        display:flex;
        overflow-x:auto;
    }

    .menu a{
        white-space:nowrap;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .content{
        padding:15px;
    }

    .topbar{
        padding:0 15px;
    }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🛡️ App <span>Protection</span>
    </div>

    <div class="menu">

        <a href="/dashboard.html">
            🏠 Dashboard
        </a>

        <a href="/apps.html">
            📱 Apps
        </a>

        <a href="/devices.html" class="active">
            📟 Devices
        </a>

        <a href="/verification.html">
            🔐 Verification
        </a>

        <a href="/settings.html">
            ⚙️ Settings
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <div class="topbar">

        <strong>Devices</strong>

        <div class="top-right">

            <span id="username">admin</span>

            <div class="avatar" id="avatar">
                A
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <div class="content">

        <h1>Devices</h1>

        <div class="subtitle">
            Manage registered devices.
        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="card">
                <div class="stat-title">
                    Pending Devices
                </div>

                <div class="stat-number" id="pendingCount">
                    0
                </div>
            </div>


            <div class="card">
                <div class="stat-title">
                    Active Devices
                </div>

                <div class="stat-number" id="activeCount">
                    0
                </div>
            </div>


            <div class="card">
                <div class="stat-title">
                    Blocked Devices
                </div>

                <div class="stat-number" id="blockedCount">
                    0
                </div>
            </div>


            <div class="card">
                <div class="stat-title">
                    Total Devices
                </div>

                <div class="stat-number" id="totalCount">
                    0
                </div>
            </div>

        </div>


        <!-- MESSAGE -->

        <div id="message" class="message"></div>


        <!-- DEVICE TABLE -->

        <div class="card">

            <div class="tabs">

                <button
                    class="tab active"
                    onclick="loadDevices('pending',this)">
                    Pending
                </button>

                <button
                    class="tab"
                    onclick="loadDevices('active',this)">
                    Active
                </button>

                <button
                    class="tab"
                    onclick="loadDevices('blocked',this)">
                    Blocked
                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>App</th>

                            <th>Device ID</th>

                            <th>Status</th>

                            <th>Active Until</th>

                            <th>Created</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="deviceTable">

                        <tr>
                            <td colspan="7" class="loading">
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const API = "/api";

let token = localStorage.getItem("token");


/*
====================================
AUTH CHECK
====================================
*/

if(!token){

    window.location.href="/login.html";

}


/*
====================================
USERNAME
====================================
*/

try{

    const admin =
        JSON.parse(
            localStorage.getItem("admin") || "{}"
        );

    if(admin.username){

        document.getElementById("username")
            .textContent=admin.username;

        document.getElementById("avatar")
            .textContent=
            admin.username.charAt(0).toUpperCase();

    }

}catch(e){}


/*
====================================
API REQUEST
====================================
*/

async function apiRequest(url,options={}){

    options.headers={
        ...(options.headers || {}),
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
    };


    const response =
        await fetch(API+url,options);


    if(response.status===401){

        logout();

        return null;

    }


    return await response.json();

}


/*
====================================
LOAD COUNTS
====================================
*/

async function loadCounts(){

    try{

        const pending =
            await apiRequest("/devices/pending");

        const active =
            await apiRequest("/devices/active");

        const blocked =
            await apiRequest("/devices/blocked");


        const pendingTotal =
            pending?.total || 0;

        const activeTotal =
            active?.total || 0;

        const blockedTotal =
            blocked?.total || 0;


        document.getElementById("pendingCount")
            .textContent=pendingTotal;

        document.getElementById("activeCount")
            .textContent=activeTotal;

        document.getElementById("blockedCount")
            .textContent=blockedTotal;

        document.getElementById("totalCount")
            .textContent=
            pendingTotal+
            activeTotal+
            blockedTotal;

    }

    catch(err){

        console.error(err);

    }

}


/*
====================================
LOAD DEVICES
====================================
*/

async function loadDevices(type,button){

    document
        .querySelectorAll(".tab")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    if(button){

        button.classList.add("active");

    }


    const tbody =
        document.getElementById("deviceTable");


    tbody.innerHTML=`
        <tr>
            <td colspan="7" class="loading">
                Loading...
            </td>
        </tr>
    `;


    try{

        const result =
            await apiRequest(
                "/devices/"+type
            );


        if(!result){

            return;

        }


        if(!result.success){

            tbody.innerHTML=`
                <tr>
                    <td colspan="7" class="empty">
                        ${escapeHtml(result.message || "Error")}
                    </td>
                </tr>
            `;

            return;

        }


        if(!result.data || result.data.length===0){

            tbody.innerHTML=`
                <tr>
                    <td colspan="7" class="empty">
                        No devices found.
                    </td>
                </tr>
            `;

            return;

        }


        tbody.innerHTML=
            result.data
                .map(device => createRow(device,type))
                .join("");

    }

    catch(err){

        console.error(err);

        tbody.innerHTML=`
            <tr>
                <td colspan="7" class="empty">
                    Server Error
                </td>
            </tr>
        `;

    }

}


/*
====================================
CREATE ROW
====================================
*/

function createRow(device,type){

    let statusClass="pending";

    if(device.status==="Active"){

        statusClass="active-status";

    }

    if(device.status==="Blocked"){

        statusClass="blocked";

    }


    let actions="";


    if(device.status==="Pending"){

        actions=`

            <button
                class="btn btn-green"
                onclick="activateDevice(${device.id})">
                Activate
            </button>

            <button
                class="btn btn-red"
                onclick="blockDevice(${device.id})">
                Block
            </button>

        `;

    }


    if(device.status==="Active"){

        actions=`

            <button
                class="btn btn-gray"
                onclick="deactivateDevice(${device.id})">
                Deactivate
            </button>

            <button
                class="btn btn-red"
                onclick="blockDevice(${device.id})">
                Block
            </button>

        `;

    }


    if(device.status==="Blocked"){

        actions=`

            <button
                class="btn btn-green"
                onclick="activateDevice(${device.id})">
                Activate
            </button>

        `;

    }


    actions+=`

        <button
            class="btn btn-red"
            onclick="deleteDevice(${device.id})">
            Delete
        </button>

    `;


    return `

        <tr>

            <td>
                ${escapeHtml(device.id)}
            </td>

            <td>
                ${escapeHtml(device.app_name || "-")}
            </td>

            <td>
                ${escapeHtml(
                    device.device_id ||
                    device.android_id ||
                    device.imei ||
                    "-"
                )}
            </td>

            <td>

                <span class="badge ${statusClass}">
                    ${escapeHtml(device.status || "-")}
                </span>

            </td>

            <td>
                ${formatDate(device.active_until)}
            </td>

            <td>
                ${formatDate(
                    device.created_at
                )}
            </td>

            <td>
                ${actions}
            </td>

        </tr>

    `;

}


/*
====================================
ACTIVATE
====================================
*/

async function activateDevice(id){

    const hours =
        prompt(
            "Enter activation hours:",
            "24"
        );


    if(hours===null){

        return;

    }


    if(
        !hours ||
        isNaN(hours) ||
        Number(hours)<=0
    ){

        showMessage(
            "Please enter valid hours.",
            false
        );

        return;

    }


    const result =
        await apiRequest(
            "/devices/activate",
            {
                method:"POST",
                body:JSON.stringify({
                    device_id:id,
                    hours:Number(hours)
                })
            }
        );


    if(result?.success){

        showMessage(
            "Device Activated Successfully",
            true
        );

        refresh();

    }

    else{

        showMessage(
            result?.message ||
            "Activation failed",
            false
        );

    }

}


/*
====================================
BLOCK
====================================
*/

async function blockDevice(id){

    if(
        !confirm(
            "Are you sure you want to block this device?"
        )
    ){

        return;

    }


    const result =
        await apiRequest(
            "/devices/block",
            {
                method:"POST",
                body:JSON.stringify({
                    device_id:id
                })
            }
        );


    if(result?.success){

        showMessage(
            "Device Blocked",
            true
        );

        refresh();

    }

    else{

        showMessage(
            result?.message ||
            "Block failed",
            false
        );

    }

}


/*
====================================
DEACTIVATE
====================================
*/

async function deactivateDevice(id){

    if(
        !confirm(
            "Deactivate this device?"
        )
    ){

        return;

    }


    const result =
        await apiRequest(
            "/devices/deactivate",
            {
                method:"POST",
                body:JSON.stringify({
                    device_id:id
                })
            }
        );


    if(result?.success){

        showMessage(
            "Device Deactivated",
            true
        );

        refresh();

    }

    else{

        showMessage(
            result?.message ||
            "Deactivate failed",
            false
        );

    }

}


/*
====================================
DELETE
====================================
*/

async function deleteDevice(id){

    if(
        !confirm(
            "Delete this device permanently?"
        )
    ){

        return;

    }


    const result =
        await apiRequest(
            "/devices/"+id,
            {
                method:"DELETE"
            }
        );


    if(result?.success){

        showMessage(
            "Device Deleted",
            true
        );

        refresh();

    }

    else{

        showMessage(
            result?.message ||
            "Delete failed",
            false
        );

    }

}


/*
====================================
REFRESH
====================================
*/

function refresh(){

    loadCounts();

    const activeTab =
        document.querySelector(".tab.active");


    let type="pending";


    if(
        activeTab &&
        activeTab.textContent
            .trim()
            .toLowerCase()
            ==="active"
    ){

        type="active";

    }


    if(
        activeTab &&
        activeTab.textContent
            .trim()
            .toLowerCase()
            ==="blocked"
    ){

        type="blocked";

    }


    loadDevices(type,activeTab);

}


/*
====================================
MESSAGE
====================================
*/

function showMessage(text,success){

    const box =
        document.getElementById("message");


    box.textContent=text;

    box.className=
        "message "+
        (success ? "success":"error");


    box.style.display="block";


    setTimeout(()=>{

        box.style.display="none";

    },3000);

}


/*
====================================
DATE
====================================
*/

function formatDate(value){

    if(!value){

        return "-";

    }


    try{

        return new Date(value)
            .toLocaleString();

    }

    catch{

        return value;

    }

}


/*
====================================
HTML ESCAPE
====================================
*/

function escapeHtml(value){

    if(value===null || value===undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/*
====================================
LOGOUT
====================================
*/

function logout(){

    localStorage.removeItem("token");

    localStorage.removeItem("admin");

    window.location.href="/login.html";

}


/*
====================================
START
====================================
*/

loadCounts();

loadDevices("pending");

</script>

</body>
</html>
