<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - App Protection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        .navbar {
            height: 65px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .logout {
            border: none;
            background: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .panel {
            margin-top: 25px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .panel h2 {
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 15px;
            }

            .welcome h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🛡 App Protection
    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</nav>


<div class="container">

    <div class="welcome">
        <h1 id="welcomeText">Admin Dashboard</h1>
        <p>App Protection Control Panel</p>
    </div>


    <div class="cards">

        <div class="card">
            <div class="card-title">Admin</div>
            <div class="card-value" id="adminName">-</div>
        </div>

        <div class="card">
            <div class="card-title">Role</div>
            <div class="card-value" id="adminRole">-</div>
        </div>

        <div class="card">
            <div class="card-title">API Status</div>
            <div class="card-value">Online</div>
        </div>

        <div class="card">
            <div class="card-title">Version</div>
            <div class="card-value">3.0</div>
        </div>

    </div>


    <div class="panel">

        <h2>System Status</h2>

        <span class="status">
            ● System Online
        </span>

        <p style="margin-top:15px;color:#6b7280;">
            Welcome to the App Protection administration panel.
        </p>

    </div>

</div>


<script>

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/login.html";
}


const adminData = localStorage.getItem("admin");

if (adminData) {

    const admin = JSON.parse(adminData);

    document.getElementById("adminName").textContent =
        admin.username || "-";

    document.getElementById("adminRole").textContent =
        admin.role || "-";

    document.getElementById("welcomeText").textContent =
        "Welcome, " + (admin.username || "Admin");

}


function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("admin");

    window.location.href = "/login.html";

}

</script>

</body>
</html>
