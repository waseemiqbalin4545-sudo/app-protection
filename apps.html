<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apps - App Protection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #111827;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 205px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px 13px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .logo span {
            color: #3b82f6;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            text-decoration: none;
            color: #d1d5db;
            padding: 12px 14px;
            border-radius: 8px;
            display: block;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* Main */
        .main {
            margin-left: 205px;
            min-height: 100vh;
        }

        .topbar {
            height: 57px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
        }

        .topbar-title {
            font-size: 18px;
            font-weight: bold;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user {
            font-size: 14px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .logout {
            border: none;
            background: #ef4444;
            color: white;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .content {
            padding: 28px;
        }

        .heading {
            margin-bottom: 22px;
        }

        .heading h1 {
            margin: 0 0 5px;
            font-size: 27px;
        }

        .heading p {
            margin: 0;
            color: #64748b;
        }

        /* Add App */
        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            margin-bottom: 22px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .add-btn {
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 13px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        .api-key {
            font-family: monospace;
            background: #f1f5f9;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.on {
            background: #dcfce7;
            color: #15803d;
        }

        .status.off {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }

        /* Mobile */
        @media (max-width: 800px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
                text-align: center;
            }

            .logo:first-letter {
                font-size: 20px;
            }

            .menu a {
                text-align: center;
                font-size: 0;
            }

            .menu a:first-letter {
                font-size: 18px;
            }

            .main {
                margin-left: 70px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 18px;
            }

            .user {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<aside class="sidebar">

    <div class="logo">
        🛡️ App <span>Protection</span>
    </div>

    <nav class="menu">
        <a href="/dashboard.html">🏠 Dashboard</a>
        <a href="/apps.html" class="active">📱 Apps</a>
        <a href="/devices.html">📟 Devices</a>
        <a href="/verification.html">🔐 Verification</a>
        <a href="/settings.html">⚙️ Settings</a>
    </nav>

</aside>


<!-- Main -->
<main class="main">

    <header class="topbar">

        <div class="topbar-title">
            Apps
        </div>

        <div class="user-area">

            <span class="user" id="username">admin</span>

            <div class="avatar" id="avatar">
                A
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <section class="content">

        <div class="heading">

            <h1>Apps</h1>

            <p>
                Manage protected applications.
            </p>

        </div>


        <!-- Message -->
        <div id="message" class="message"></div>


        <!-- Add App -->
        <div class="card">

            <h2>
                Add New App
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        App Name
                    </label>

                    <input
                        type="text"
                        id="app_name"
                        placeholder="Example App"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Package Name
                    </label>

                    <input
                        type="text"
                        id="package_name"
                        placeholder="com.example.app"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Version
                    </label>

                    <input
                        type="text"
                        id="version"
                        placeholder="1.0"
                        value="1.0"
                    >

                </div>

            </div>


            <button
                class="add-btn"
                onclick="addApp()"
            >
                + Add App
            </button>

        </div>


        <!-- Apps List -->
        <div class="card">

            <h2>
                App Management
            </h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>App Name</th>
                            <th>Package Name</th>
                            <th>Version</th>
                            <th>API Key</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="appsTable">

                        <tr>
                            <td colspan="7" class="empty">
                                Loading apps...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>


<script>

const API = "/api";


// ================================
// Check Login
// ================================

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/login.html";
}


// ================================
// Load Admin
// ================================

try {

    const admin = JSON.parse(
        localStorage.getItem("admin")
    );

    if (admin) {

        document.getElementById("username").textContent =
            admin.username || "admin";

        document.getElementById("avatar").textContent =
            (admin.username || "A")
                .charAt(0)
                .toUpperCase();

    }

} catch (e) {
    console.log(e);
}


// ================================
// Show Message
// ================================

function showMessage(text, type) {

    const box = document.getElementById("message");

    box.textContent = text;

    box.className = "message " + type;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 3000);
}


// ================================
// Load Apps
// ================================

async function loadApps() {

    try {

        const response = await fetch(
            `${API}/apps/all`,
            {
                method: "GET",

                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                logout();
                return;
            }

            throw new Error(
                result.message || "Unable to load apps"
            );
        }

        const table =
            document.getElementById("appsTable");

        table.innerHTML = "";

        if (!result.data || result.data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No apps found.
                    </td>
                </tr>
            `;

            return;
        }


        result.data.forEach(app => {

            const row =
                document.createElement("tr");

            const statusClass =
                app.status ? "on" : "off";

            const statusText =
                app.status ? "ON" : "OFF";


            row.innerHTML = `

                <td>${escapeHtml(app.id)}</td>

                <td>
                    <strong>
                        ${escapeHtml(app.app_name)}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(app.package_name)}
                </td>

                <td>
                    ${escapeHtml(app.version || "-")}
                </td>

                <td>
                    <span class="api-key">
                        ${escapeHtml(app.api_key || "-")}
                    </span>
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${statusText}
                    </span>
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteApp(${app.id})"
                    >
                        Delete
                    </button>
                </td>

            `;

            table.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("appsTable").innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }
}


// ================================
// Add App
// ================================

async function addApp() {

    const app_name =
        document.getElementById("app_name").value.trim();

    const package_name =
        document.getElementById("package_name").value.trim();

    const version =
        document.getElementById("version").value.trim();


    if (!app_name || !package_name) {

        showMessage(
            "App Name & Package Name required",
            "error"
        );

        return;
    }


    try {

        const response = await fetch(
            `${API}/apps/add`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({
                    app_name,
                    package_name,
                    version: version || "1.0"
                })
            }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

            if (
                response.status === 401 ||
                response.status === 403
            ) {
                logout();
                return;
            }

            showMessage(
                result.message || "Failed to add app",
                "error"
            );

            return;
        }


        showMessage(
            "App Added Successfully",
            "success"
        );


        document.getElementById("app_name").value = "";
        document.getElementById("package_name").value = "";
        document.getElementById("version").value = "1.0";


        loadApps();

    } catch (error) {

        console.error(error);

        showMessage(
            "Server connection error",
            "error"
        );

    }
}


// ================================
// Delete App
// ================================

async function deleteApp(id) {

    if (
        !confirm(
            "Are you sure you want to delete this app?"
        )
    ) {
        return;
    }


    try {

        const response = await fetch(
            `${API}/apps/${id}`,
            {
                method: "DELETE",

                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

            showMessage(
                result.message || "Delete failed",
                "error"
            );

            return;
        }


        showMessage(
            "App Deleted Successfully",
            "success"
        );


        loadApps();

    } catch (error) {

        console.error(error);

        showMessage(
            "Server connection error",
            "error"
        );

    }
}


// ================================
// Logout
// ================================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("admin");

    window.location.href =
        "/login.html";
}


// ================================
// HTML Escape
// ================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ================================
// Start
// ================================

loadApps();

</script>

</body>
</html>
