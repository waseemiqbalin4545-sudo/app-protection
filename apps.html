<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apps - App Protection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #111827;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 210px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px 13px;
            z-index: 1000;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 25px;
        }

        .brand span {
            color: #60a5fa;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 6px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #d1d5db;
            padding: 12px 14px;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 210px;
            min-height: 100vh;
        }

        /* TOPBAR */

        .topbar {
            height: 65px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .page-title {
            font-size: 20px;
            font-weight: bold;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .logout {
            border: none;
            background: #ef4444;
            color: white;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        /* CONTENT */

        .content {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 27px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #6b7280;
        }

        /* PANEL */

        .panel {
            background: white;
            border-radius: 12px;
            margin-top: 22px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .add-btn {
            margin-top: 18px;
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .add-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        /* MESSAGE */

        .message {
            margin-top: 15px;
            padding: 11px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f8fafc;
            text-align: left;
            padding: 12px;
            font-size: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        .api-key {
            font-family: monospace;
            background: #f3f4f6;
            padding: 5px 7px;
            border-radius: 5px;
            word-break: break-all;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-on {
            background: #dcfce7;
            color: #166534;
        }

        .status-off {
            background: #fee2e2;
            color: #991b1b;
        }

        .delete-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 7px 11px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 25px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {

            .sidebar {
                position: fixed;
                transform: translateX(-100%);
                transition: 0.25s;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
            }

            .content {
                padding: 18px;
            }

            .topbar {
                padding: 0 15px;
            }

            .admin-name {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="brand">
        🛡 App <span>Protection</span>
    </div>

    <ul class="menu">

        <li>
            <a href="/dashboard.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="/apps.html" class="active">
                📱 Apps
            </a>
        </li>

        <li>
            <a href="/devices.html">
                📲 Devices
            </a>
        </li>

        <li>
            <a href="/verification.html">
                🔐 Verification
            </a>
        </li>

        <li>
            <a href="/settings.html">
                ⚙ Settings
            </a>
        </li>

    </ul>

</aside>


<!-- MAIN -->

<div class="main">

    <!-- TOPBAR -->

    <header class="topbar">

        <div class="page-title">
            Apps
        </div>

        <div class="admin-info">

            <div class="admin-name" id="adminName">
                admin
            </div>

            <div class="admin-avatar" id="avatar">
                A
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <div class="welcome">

            <h1>
                Apps
            </h1>

            <p>
                Manage protected applications.
            </p>

        </div>


        <!-- ADD APP -->

        <div class="panel">

            <h2>
                Add New App
            </h2>

            <form id="addAppForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            App Name
                        </label>

                        <input
                            type="text"
                            id="app_name"
                            placeholder="Example App"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Package Name
                        </label>

                        <input
                            type="text"
                            id="package_name"
                            placeholder="com.example.app"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Version
                        </label>

                        <input
                            type="text"
                            id="version"
                            placeholder="1.0"
                            value="1.0"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="add-btn"
                    id="addBtn"
                >
                    + Add App
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>

        </div>


        <!-- APP MANAGEMENT -->

        <div class="panel">

            <h2>
                App Management
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>App Name</th>

                            <th>Package Name</th>

                            <th>Version</th>

                            <th>API Key</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="appsTable">

                        <tr>

                            <td
                                colspan="7"
                                class="loading"
                            >
                                Loading apps...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

/* ==========================================
   API URL
========================================== */

const API_URL = "";


/* ==========================================
   AUTH CHECK
========================================== */

const token = localStorage.getItem("token");

if (!token) {

    window.location.href = "/login.html";

}


/* ==========================================
   ADMIN DATA
========================================== */

const adminData = localStorage.getItem("admin");

if (adminData) {

    try {

        const admin = JSON.parse(adminData);

        const username = admin.username || "Admin";

        document.getElementById("adminName").textContent =
            username;

        document.getElementById("avatar").textContent =
            username.charAt(0).toUpperCase();

    } catch (e) {

        console.log(e);

    }

}


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(text, type) {

    const message = document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}


/* ==========================================
   LOAD APPS
========================================== */

async function loadApps() {

    const table =
        document.getElementById("appsTable");

    table.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                Loading apps...
            </td>
        </tr>
    `;

    try {

        const response = await fetch(
            API_URL + "/api/apps/all",
            {
                method: "GET",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                }
            }
        );

        const result = await response.json();

        console.log("Apps API:", result);


        if (!response.ok || !result.success) {

            throw new Error(
                result.message || "Unable to load apps"
            );

        }


        if (!result.data || result.data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No apps found.
                    </td>
                </tr>
            `;

            return;

        }


        table.innerHTML = "";


        result.data.forEach(app => {

            const status =
                app.status === true ||
                app.status === "true"
                    ? `<span class="status status-on">ON</span>`
                    : `<span class="status status-off">OFF</span>`;


            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${app.id ?? ""}</td>

                <td>${escapeHtml(app.app_name ?? "")}</td>

                <td>${escapeHtml(app.package_name ?? "")}</td>

                <td>${escapeHtml(app.version ?? "")}</td>

                <td>
                    <span class="api-key">
                        ${escapeHtml(app.api_key ?? "")}
                    </span>
                </td>

                <td>
                    ${status}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteApp(${app.id})"
                    >
                        Delete
                    </button>

                </td>

            `;

            table.appendChild(row);

        });

    }

    catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


/* ==========================================
   ADD APP
========================================== */

document
    .getElementById("addAppForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const app_name =
            document
                .getElementById("app_name")
                .value
                .trim();


        const package_name =
            document
                .getElementById("package_name")
                .value
                .trim();


        const version =
            document
                .getElementById("version")
                .value
                .trim() || "1.0";


        const button =
            document.getElementById("addBtn");


        button.disabled = true;

        button.textContent = "Adding...";


        try {

            const response = await fetch(
                API_URL + "/api/apps/add",
                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        app_name,
                        package_name,
                        version

                    })

                }
            );


            const result =
                await response.json();


            console.log("Add App API:", result);


            if (!response.ok || !result.success) {

                throw new Error(
                    result.message || "App could not be added"
                );

            }


            showMessage(
                "App Added Successfully",
                "success"
            );


            document
                .getElementById("addAppForm")
                .reset();


            document
                .getElementById("version")
                .value = "1.0";


            await loadApps();

        }

        catch (error) {

            console.error(error);

            showMessage(
                error.message,
                "error"
            );

        }

        finally {

            button.disabled = false;

            button.textContent = "+ Add App";

        }

    });


/* ==========================================
   DELETE APP
========================================== */

async function deleteApp(id) {

    if (!confirm(
        "Are you sure you want to delete this app?"
    )) {

        return;

    }


    try {

        const response = await fetch(

            API_URL + "/api/apps/" + id,

            {

                method: "DELETE",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"

                }

            }

        );


        const result =
            await response.json();


        if (!response.ok || !result.success) {

            throw new Error(
                result.message || "Delete failed"
            );

        }


        showMessage(
            "App Deleted Successfully",
            "success"
        );


        loadApps();

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("admin");

    window.location.href =
        "/login.html";

}


/* ==========================================
   LOAD
========================================== */

loadApps();

</script>

</body>
</html>
