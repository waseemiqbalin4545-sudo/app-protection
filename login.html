<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - App Protection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">AP</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        App Protection Control Panel
    </p>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="footer">
        App Protection API v3.0
    </div>

</div>


<script>

const API_URL = "/api/auth/login";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    message.className = "message";
    message.textContent = "";

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

    localStorage.setItem("token", data.token);

    localStorage.setItem(
        "admin",
        JSON.stringify(data.admin)
    );

    message.className = "message success";
    message.textContent = "Login Successful!";

    setTimeout(() => {
        window.location.href = "/dashboard.html";
    }, 500);

            /*
             * Abhi dashboard page nahi banaya,
             * is liye filhal login successful message show hoga.
             *
             * Dashboard banne ke baad:
             * window.location.href = "dashboard.html";
             */

        } else {

            message.className = "message error";
            message.textContent = data.message || "Login Failed";

        }

    } catch (error) {

        console.error(error);

        message.className = "message error";
        message.textContent = "Server connection error";

    }

    button.disabled = false;
    button.textContent = "Login";

});

</script>

</body>
</html>
